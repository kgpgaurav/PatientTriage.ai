<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatientTriage.ai — Live Intake</title>
<style>
  :root{
    --bg:#0A0C10; --panel:#12151C; --panel-2:#171B23; --line:#232833;
    --text:#E7EBF0; --muted:#7C8592; --accent:#6FE7DD;
    --band1:#E5484D; --band2:#F4A261; --band3:#F0C64B; --band4:#4FA8D8; --band5:#52B788;
    --mono: ui-monospace, "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding:24px 20px 80px;}
  .wrap{max-width:1180px;margin:0 auto;}

  header.board-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px;flex-wrap:wrap;gap:14px;
  }
  .title-block h1{font-size:20px;letter-spacing:.02em;margin:0 0 4px;font-weight:600;}
  .title-block .sub{color:var(--muted);font-size:13px;font-family:var(--mono);}
  .conn{font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:14px;}
  .conn input{background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:3px;width:220px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;}
  .dot.ok{background:var(--band5);box-shadow:0 0 0 3px rgba(82,183,136,.15);}
  .dot.bad{background:var(--band1);box-shadow:0 0 0 3px rgba(229,72,77,.15);}

  .grid{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start;}
  @media (max-width: 900px){ .grid{grid-template-columns:1fr;} }

  .panel{background:var(--panel);border:1px solid var(--line);padding:18px;}
  .panel h2{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-bottom:4px;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:13px;padding:7px 9px;border-radius:3px;
  }
  .field textarea{resize:vertical;min-height:54px;font-family:var(--sans);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .checks{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px;}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-family:var(--mono);}
  .chk input{accent-color:var(--accent);}
  .symptom-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:14px;}

  .btn{
    font-family:var(--sans);font-size:13px;font-weight:600;background:var(--accent);color:#04201d;
    border:none;padding:10px 16px;border-radius:4px;cursor:pointer;width:100%;
  }
  .btn:hover{opacity:.9;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line);width:auto;padding:6px 12px;font-size:12px;font-weight:500;}

  .result-box{margin-top:16px;border:1px solid var(--line);padding:14px;display:none;}
  .result-box.show{display:block;}
  .result-band{font-family:var(--mono);font-weight:700;font-size:22px;padding:2px 10px;border-radius:4px;display:inline-block;}
  .result-line{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6;}
  .result-line b{color:var(--text);}
  .gate-note{margin-top:8px;font-size:13px;}
  .shap-list{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11.5px;}
  .shap-row{display:flex;gap:8px;align-items:center;}
  .shap-name{width:140px;color:var(--muted);flex-shrink:0;}
  .shap-bar-track{flex:1;height:5px;background:var(--line);position:relative;}
  .shap-bar{height:5px;position:absolute;top:0;}
  .error-box{margin-top:12px;color:var(--band1);font-family:var(--mono);font-size:12.5px;display:none;}
  .error-box.show{display:block;}

  table.queue{width:100%;border-collapse:collapse;font-size:13px;}
  table.queue thead th{text-align:left;font-family:var(--mono);font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);}
  table.queue tr.row{border-bottom:1px solid var(--line);cursor:pointer;}
  table.queue tr.row:hover td{background:var(--panel-2);}
  table.queue td{padding:8px;vertical-align:middle;}
  td.band-cell{width:6px;padding:0;}
  .band-bar{width:6px;height:100%;min-height:34px;display:block;}
  .pid{font-family:var(--mono);font-weight:600;}
  .band-pill{font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;min-width:20px;text-align:center;display:inline-block;}
  .wait{font-family:var(--mono);font-size:12px;}
  .wait.breach{color:var(--band1);font-weight:700;}
  .quality{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);}
  .quality.HIGH{color:var(--band5);border-color:var(--band5);}
  .quality.MEDIUM{color:var(--band3);border-color:var(--band3);}
  .quality.LOW{color:var(--band1);border-color:var(--band1);}
  .empty-row{color:var(--muted);font-family:var(--mono);font-size:12px;padding:16px 8px;}

  .detail{background:var(--panel-2);border-bottom:1px solid var(--line);display:none;}
  .detail.open{display:table-row;}
  .detail td{padding:14px 16px;}
  .override-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .override-form select, .override-form input{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:12px;padding:6px 8px;border-radius:3px;
  }
  .override-form input[type=text]{flex:1;min-width:200px;}

  .audit-panel{margin-top:24px;}
  .audit-list{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .audit-list b{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">

  <header class="board-head">
    <div class="title-block">
      <h1>PATIENTTRIAGE.AI — LIVE INTAKE</h1>
      <div class="sub">nurse-entered patients only · live model calls · persisted to SQLite</div>
    </div>
    <div class="conn">
      <span id="conn-dot" class="dot bad"></span><span id="conn-text">checking API...</span>
      <input id="api-base" type="text" value="http://localhost:8000" spellcheck="false">
      <button class="btn secondary" onclick="checkConn()">reconnect</button>
    </div>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>New patient / reassessment</h2>
      <form id="intake-form">
        <div class="field">
          <label>Patient ID</label>
          <input type="text" id="f-patient-id" placeholder="e.g. P-1042 or MRN" required>
        </div>
        <div class="row3">
          <div class="field"><label>Age</label><input type="number" id="f-age" min="0" max="120" required></div>
          <div class="field"><label>Age group</label>
            <div id="f-age-group-derived" style="padding:7px 9px;color:var(--muted);font-family:var(--mono);font-size:13px;">auto (from age)</div>
          </div>
          <div class="field"><label>Has prior history?</label>
            <select id="f-history"><option value="true">yes</option><option value="false">no (first visit)</option></select>
          </div>
        </div>

        <div class="row3">
          <div class="field"><label>HR</label><input type="number" id="f-hr"></div>
          <div class="field"><label>SBP</label><input type="number" id="f-sbp"></div>
          <div class="field"><label>RR</label><input type="number" id="f-rr"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Temp (°C)</label><input type="number" step="0.1" id="f-temp"></div>
          <div class="field"><label>SpO2 (%)</label><input type="number" id="f-spo2"></div>
        </div>

        <div class="checks">
          <label class="chk"><input type="checkbox" id="f-altered">Altered mental status</label>
          <label class="chk"><input type="checkbox" id="f-pregnant">Pregnancy</label>
        </div>

        <div class="field"><label>Symptoms observed</label></div>
        <div class="symptom-grid" id="symptom-grid"></div>

        <div class="field">
          <label>Free-text note (optional — parsed by extraction layer)</label>
          <textarea id="f-note" placeholder="e.g. pt c/o chest tightness x2 days, denies SOB, appears anxious"></textarea>
        </div>

        <button type="submit" class="btn" id="submit-btn">Submit to triage</button>
      </form>

      <div class="error-box" id="error-box"></div>

      <div class="result-box" id="result-box">
        <span id="result-band" class="result-band"></span>
        <span id="result-reassess" style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px;"></span>
        <div class="result-line" id="result-line"></div>
        <div class="gate-note" id="result-gate"></div>
        <div class="shap-list" id="result-shap"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Live queue (polling every 4s)</h2>
      <table class="queue">
        <thead><tr><th></th><th>Patient</th><th>Completeness</th><th>P(critical)</th><th>Final band</th><th>Waited</th></tr></thead>
        <tbody id="queue-body"></tbody>
      </table>

      <div class="audit-panel">
        <h2>Audit trail</h2>
        <div class="audit-list" id="audit-list"></div>
      </div>
    </div>
  </div>

</div>

<script>
const SYMPTOMS = ["chest_pain","shortness_of_breath","fever","confusion","headache","abdominal_pain",
  "vomiting","bleeding","weakness","dizziness","cough","rash","fall","back_pain"];
const bandColor = {1:'var(--band1)',2:'var(--band2)',3:'var(--band3)',4:'var(--band4)',5:'var(--band5)'};

const symptomGrid = document.getElementById('symptom-grid');
symptomGrid.innerHTML = SYMPTOMS.map(s =>
  `<label class="chk"><input type="checkbox" data-symptom="${s}"> ${s.replace(/_/g,' ')}</label>`
).join('');

function apiBase(){ return document.getElementById('api-base').value.replace(/\/$/, ''); }

async function checkConn(){
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  try{
    const r = await fetch(apiBase() + '/model/status');
    if(!r.ok) throw new Error('bad status');
    const d = await r.json();
    dot.className = 'dot ok';
    txt.textContent = 'connected · model ' + d.status;
  }catch(e){
    dot.className = 'dot bad';
    txt.textContent = 'not connected — is uvicorn api:app running?';
  }
}

function bandPill(band){
  if(band == null) return '—';
  return `<span class="band-pill" style="background:${bandColor[band]}22;color:${bandColor[band]};border:1px solid ${bandColor[band]}">${band}</span>`;
}

document.getElementById('intake-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errBox = document.getElementById('error-box');
  const resultBox = document.getElementById('result-box');
  errBox.classList.remove('show');
  resultBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const symptoms = {};
  document.querySelectorAll('#symptom-grid input[type=checkbox]').forEach(cb => {
    if(cb.checked) symptoms[cb.dataset.symptom] = true;
  });

  const payload = {
    patient_id: document.getElementById('f-patient-id').value.trim(),
    age: parseInt(document.getElementById('f-age').value, 10),
    hr: numOrNull('f-hr'), sbp: numOrNull('f-sbp'), rr: numOrNull('f-rr'),
    temp: numOrNull('f-temp'), spo2: numOrNull('f-spo2'),
    mental_status_altered: document.getElementById('f-altered').checked,
    pregnancy: document.getElementById('f-pregnant').checked,
    has_prior_history: document.getElementById('f-history').value === 'true',
    symptoms: symptoms,
    note: document.getElementById('f-note').value.trim() || null,
  };

  try{
    const r = await fetch(apiBase() + '/triage', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
    });
    if(!r.ok){
      const d = await r.json().catch(() => ({detail: r.statusText}));
      throw new Error(d.detail || 'request failed');
    }
    const result = await r.json();
    showResult(result);
    refreshQueue();
    refreshAudit();
  }catch(err){
    errBox.textContent = 'Submission failed: ' + err.message;
    errBox.classList.add('show');
  }finally{
    btn.disabled = false;
    btn.textContent = 'Submit to triage';
  }
});

function numOrNull(id){
  const v = document.getElementById(id).value;
  return v === '' ? null : parseFloat(v);
}

function showResult(result){
  const box = document.getElementById('result-box');
  const band = result.final_recommended_band;
  document.getElementById('result-band').textContent = 'BAND ' + band;
  document.getElementById('result-band').style.background = bandColor[band] + '22';
  document.getElementById('result-band').style.color = bandColor[band];
  document.getElementById('result-band').style.border = '1px solid ' + bandColor[band];
  document.getElementById('result-reassess').textContent = result.is_reassessment ? '(reassessment — history applied)' : '(new patient)';
  const fallbackNote = result.recommendation_mode === 'safety_fallback'
    ? `<div class="error-box show" style="margin-top:10px">ML model unavailable — safety-fallback recommendation (Band ${result.fallback_band}), not a model prediction.</div>` : '';
  const mismatchNote = result.observed_reported_mismatch
    ? `<div class="result-line" title="Informational only — not used in risk scoring or the Safety Gate">Observed/reported mismatch flagged (informational only)</div>` : '';
  document.getElementById('result-line').innerHTML =
    `${fallbackNote}
     P(critical) <b>${result.critical_probability != null ? result.critical_probability.toFixed(2) : '—'}</b> &nbsp;
     model band <b>${result.model_recommended_band}</b> &nbsp;
     input completeness <b>${result.input_completeness}</b> &nbsp;
     extraction <b>${result.extraction_backend || 'none'}</b>
     ${mismatchNote}`;
  const gateEl = document.getElementById('result-gate');
  gateEl.textContent = result.safety_gate_reason;
  gateEl.style.color = band < result.model_recommended_band ? 'var(--band1)' : 'var(--band5)';

  const shapEl = document.getElementById('result-shap');
  if(result.model_explanation && result.model_explanation.length){
    const maxAbs = Math.max(...result.model_explanation.map(x => Math.abs(x.contribution)));
    shapEl.innerHTML = result.model_explanation.map(item => {
      const pct = Math.round(Math.abs(item.contribution) / maxAbs * 100);
      const positive = item.contribution >= 0;
      const color = positive ? 'var(--band1)' : 'var(--band5)';
      const left = positive ? 50 : 50 - pct/2;
      return `<div class="shap-row">
        <div class="shap-name">${item.feature}</div>
        <div class="shap-bar-track"><div class="shap-bar" style="left:${left}%;width:${pct/2}%;background:${color}"></div></div>
        <div style="width:50px;text-align:right;color:${color}">${positive?'+':''}${item.contribution.toFixed(2)}</div>
      </div>`;
    }).join('');
  } else {
    shapEl.innerHTML = '';
  }
  box.classList.add('show');
}

async function refreshQueue(){
  try{
    const r = await fetch(apiBase() + '/queue');
    if(!r.ok) return;
    const d = await r.json();
    const body = document.getElementById('queue-body');
    if(!d.summary.length){
      body.innerHTML = `<tr><td colspan="6" class="empty-row">Queue is empty — submit a patient on the left.</td></tr>`;
      return;
    }
    body.innerHTML = d.summary.map(p => `
      <tr class="row" onclick="toggleDetail('${p.patient_id}')">
        <td class="band-cell"><span class="band-bar" style="background:${bandColor[p.final_recommended_band]}"></span></td>
        <td class="pid">${p.patient_id}${p.reassessment_required ? ' <span style="color:var(--band1);font-size:10px">REASSESS</span>' : ''}</td>
        <td><span class="quality ${p.input_completeness}">${p.input_completeness}</span></td>
        <td style="font-family:var(--mono);font-size:12px">${p.critical_probability != null ? p.critical_probability.toFixed(2) : '—'}</td>
        <td>${bandPill(p.final_recommended_band)}</td>
        <td class="wait ${p.breached ? 'breach' : ''}">${p.waited_min}m / ${p.ceiling_min}m${p.breached ? ' ⚠' : ''}</td>
      </tr>
      <tr class="detail" id="detail-${p.patient_id}"><td colspan="6">${detailPanel(p)}</td></tr>
    `).join('');
  }catch(e){ /* connection issue, ignore this poll */ }
}

function detailPanel(p){
  return `
    <div style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px">
      ${p.safety_gate_reason}
    </div>
    <div class="override-form">
      <select id="sel-${p.patient_id}">
        ${[1,2,3,4,5].map(b => `<option value="${b}" ${b===p.final_recommended_band?'selected':''}>Band ${b}</option>`).join('')}
      </select>
      <input type="text" id="reason-${p.patient_id}" placeholder="reason code (required for downgrade)">
      <button class="btn secondary" onclick="submitOverride('${p.patient_id}', ${p.final_recommended_band})">Log clinician decision</button>
    </div>
  `;
}

function toggleDetail(pid){
  const row = document.getElementById('detail-' + pid);
  document.querySelectorAll('.detail.open').forEach(r => { if(r.id !== 'detail-' + pid) r.classList.remove('open'); });
  row.classList.toggle('open');
}

async function submitOverride(pid, aiBand){
  const sel = document.getElementById('sel-' + pid);
  const reasonInput = document.getElementById('reason-' + pid);
  const clinicianBand = parseInt(sel.value, 10);
  const reason = reasonInput.value.trim();

  try{
    const r = await fetch(apiBase() + '/override', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        patient_id: pid, ai_recommendation_band: aiBand,
        clinician_band: clinicianBand, reason_code: reason || null,
      }),
    });
    if(!r.ok){
      const d = await r.json().catch(() => ({detail: r.statusText}));
      reasonInput.style.borderColor = 'var(--band1)';
      reasonInput.placeholder = d.detail;
      return;
    }
    refreshAudit();
  }catch(e){
    reasonInput.style.borderColor = 'var(--band1)';
    reasonInput.placeholder = 'connection error';
  }
}

async function refreshAudit(){
  try{
    const r = await fetch(apiBase() + '/audit?n=15');
    if(!r.ok) return;
    const entries = await r.json();
    const el = document.getElementById('audit-list');
    el.innerHTML = [...entries].reverse().map(e => {
      const time = (e.created_at || '').slice(11, 19);
      let line = `${time} — <b>${e.event_type}</b> ${e.patient_id}`;
      if(e.final_recommended_band != null) line += `: band ${e.final_recommended_band}`;
      if(e.clinician_decision_band != null) line += `: AI ${e.ai_recommendation_band} → clinician ${e.clinician_decision_band}`;
      if(e.override_reason) line += ` ("${e.override_reason}")`;
      return `<div>${line}</div>`;
    }).join('');
  }catch(e){ /* ignore */ }
}

checkConn();
refreshQueue();
refreshAudit();
setInterval(() => { checkConn(); refreshQueue(); refreshAudit(); }, 4000);
</script>
</body>
</html>
